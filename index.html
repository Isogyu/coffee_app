<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ブラックエプロン試験(コーヒーマスター)対策の4択クイズアプリ">
  <meta name="theme-color" content="#00754a">

  <!-- PWA / モバイル対応 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BEクイズ">

  <title>ブラックエプロン試験クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="logo-mark">&#9749;</div>
      <div>
        <h1 class="app-title">ブラックエプロン試験クイズ</h1>
        <p class="app-subtitle">Coffee Master Practice</p>
      </div>
    </header>

    <main id="screen" class="screen"><!-- JSで描画 --></main>

    <footer class="app-footer">
      練習問題は一般的な出題範囲に基づくオリジナル問題です
    </footer>
  </div>

  <!-- データ(classic script: window.QUESTION_DATA へ push される) -->
  <script src="data/questions/basic.js"></script>
  <script src="data/questions/origin.js"></script>
  <script src="data/questions/process.js"></script>
  <script src="data/questions/brewing.js"></script>
  <script src="data/questions/tasting.js"></script>
  <script src="data/questions/core-coffee.js"></script>
  <script src="data/questions/history.js"></script>

  <script src="core.js"></script>
  <script src="app.js"></script>
  <script>
    // オフライン対応・ホーム画面追加(PWA)のためのService Worker登録
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
